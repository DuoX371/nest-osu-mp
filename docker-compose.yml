services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:${PORT:-3000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    labels:
      - "traefik.docker.network=coolify"
      - "traefik.enable=true"
      - "traefik.http.routers.http-0-swd0q90gid60sbg6cr4qdi2s-api.entryPoints=http"
      - "traefik.http.routers.http-0-swd0q90gid60sbg6cr4qdi2s-api.rule=Host(`apig.chooh.moe`) && PathPrefix(`/`)"
      - "traefik.http.routers.http-0-swd0q90gid60sbg6cr4qdi2s-api.middlewares=gzip"
      - "traefik.http.routers.http-0-swd0q90gid60sbg6cr4qdi2s-api.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.gzip.compress=true"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:${PORT:-3001}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
